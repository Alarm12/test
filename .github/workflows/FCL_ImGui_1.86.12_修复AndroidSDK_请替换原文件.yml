# Experimental and reproducible build; no original mod jars are modified.
name: Build FCL ImGui 1.86.12 Android ARM64

'on': [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Prepare Java 8 and Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Prepare Android SDK (avoid retired tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Fetch the exact imgui-java sources and Android NDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.86.12 --recurse-submodules \
            https://github.com/SpaiR/imgui-java.git imgui-java-src
          test -f imgui-java-src/buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy
          test -f imgui-java-src/include/imgui/imgui.cpp
          echo "Source: SpaiR/imgui-java v1.86.12"
          echo "Installing Android NDK r26d..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Generate the imgui-java 1.86.12 JNI C++ sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("imgui-java-src/buildSrc/src/main/groovy/tool/generator/GenerateLibs.groovy")
          t = p.read_text(encoding="utf-8")
          anchor = "        // Generate platform dependant ant configs and header files"
          assert t.count(anchor) == 1, "Upstream generator layout changed. Stop instead of patching the wrong code."
          replacement = (
              '        if (System.getProperty("fclJniOnly") == "true") {\n'
              '            println("FCL Android: JNI sources generated; native platform build delegated to CMake.")\n'
              '            return\n'
              '        }\n\n'
              + anchor
          )
          p.write_text(t.replace(anchor, replacement), encoding="utf-8")
          print("Verified and prepared JNI code generator.")
          PY
          cd imgui-java-src
          chmod +x gradlew
          ./gradlew --no-daemon :imgui-binding:generateLibs -Denvs=linux -Dlocal -DfclJniOnly=true
          cd ..
          JNI_DIR="$GITHUB_WORKSPACE/imgui-java-src/imgui-binding/build/jni"
          test -f "$JNI_DIR/_common.h"
          test "$(find "$JNI_DIR" -maxdepth 1 -name '*.cpp' | wc -l)" -gt 10
          echo "JNI .cpp files: $(find "$JNI_DIR" -maxdepth 1 -name '*.cpp' | wc -l)"
      - name: Cross-compile the Android ARM64 shared library
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("imgui-java-src/imgui-binding/build/jni/ImGuiFileDialog.cpp")
          if not p.is_file():
              raise SystemExit("Missing generated ImGuiFileDialog.cpp")
          original = p.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^([ \t]*#[ \t]*include[ \t]*)"dirent/dirent\.h"([ \t]*(?://[^\n]*)?)$')
          patched, count = pattern.subn(r'\1<dirent.h>\2', original)
          if count != 1:
              raise SystemExit(
                  f"Expected one Windows-only dirent include, found {count}; "
                  "upstream source may have changed, stopping safely."
              )
          p.write_text(patched, encoding="utf-8")
          assert '#include <dirent.h>' in patched
          assert '#include "dirent/dirent.h"' not in patched
          print("Android fix: ImGuiFileDialog uses NDK <dirent.h>; removed Windows-only header.")
          PY

          python3 - <<'PY'
          from pathlib import Path

          p = Path("imgui-java-src/imgui-binding/build/jni/imgui_extension_implot_ImPlot.cpp")
          if not p.is_file():
              raise SystemExit("Missing generated ImPlot JNI C++ source")

          source = p.read_text(encoding="utf-8")
          changes = [
              (
                  "ImPlot::Annotate(x, y, pixOffset, col, a);",
                  'ImPlot::Annotate(x, y, pixOffset, col, "%s", a);',
              ),
              (
                  "ImPlot::AnnotateClamped(x, y, pixOffset, col, a);",
                  'ImPlot::AnnotateClamped(x, y, pixOffset, col, "%s", a);',
              ),
          ]
          for needle, fixed in changes:
              matches = source.count(needle)
              if matches != 1:
                  raise SystemExit(
                      f"Expected one exact occurrence of {needle!r}; found {matches}. "
                      "Stopping rather than changing unknown upstream JNI code."
                  )
              source = source.replace(needle, fixed, 1)

          p.write_text(source, encoding="utf-8")
          print("Fixed both ImPlot format-security errors with literal '%s'.")
          PY
          mkdir -p fcl-cmake
          cat > fcl-cmake/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.18)
          project(FCLImguiJavaJNI LANGUAGES C CXX)
          if(NOT DEFINED JNI_DIR OR NOT EXISTS "${JNI_DIR}/_common.h")
              message(FATAL_ERROR "Generated imgui-java JNI source directory missing")
          endif()
          file(GLOB JNI_SOURCES CONFIGURE_DEPENDS "${JNI_DIR}/*.cpp" "${JNI_DIR}/*.c")
          list(LENGTH JNI_SOURCES SOURCE_COUNT)
          if(SOURCE_COUNT LESS 10)
              message(FATAL_ERROR "Unexpectedly few JNI/C++ sources")
          endif()
          message(STATUS "Compiling ${SOURCE_COUNT} ImGui 1.86.12 sources")
          add_library(imgui-java64 SHARED ${JNI_SOURCES})
          target_include_directories(imgui-java64 PRIVATE "${JNI_DIR}")
          set_target_properties(imgui-java64 PROPERTIES
              CXX_STANDARD 14
              CXX_STANDARD_REQUIRED YES
              LIBRARY_OUTPUT_DIRECTORY "${CMAKE_CURRENT_SOURCE_DIR}/dist"
          )
          target_compile_options(imgui-java64 PRIVATE -O2 -fPIC)
          target_link_libraries(imgui-java64 PRIVATE log android)
          CMAKE

          cmake -S fcl-cmake -B fcl-cmake/build \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DJNI_DIR="$GITHUB_WORKSPACE/imgui-java-src/imgui-binding/build/jni"
          cmake --build fcl-cmake/build --parallel 2
          test -s fcl-cmake/dist/libimgui-java64.so
      - name: Validate JNI exports and Android architecture
        shell: bash
        run: |
          set -euo pipefail
          LIB="fcl-cmake/dist/libimgui-java64.so"
          test -s "$LIB"
          echo "ELF architecture:"
          readelf -h "$LIB" | grep -E 'Class:|Machine:'
          readelf -h "$LIB" | grep -Eq 'Machine:.*AArch64'
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$NM"
          "$NM" -D --defined-only "$LIB" > fcl-cmake/exported-symbols.txt
          COUNT="$(grep -c ' Java_imgui_' fcl-cmake/exported-symbols.txt || true)"
          echo "ImGui JNI symbols exported: $COUNT"
          # The user's bundled Windows imgui-java 1.86.12 DLL has ~2144 such exports.
          test "$COUNT" -ge 2000
          for SYMBOL in \
            Java_imgui_ImGui_nInitJni \
            Java_imgui_ImGui_setAssertCallback \
            Java_imgui_ImFontAtlas_nInit \
            Java_imgui_ImGuiPlatformIO_nInit
          do
              grep -F "$SYMBOL" fcl-cmake/exported-symbols.txt >/dev/null
          done
          if readelf -d "$LIB" | grep -F "libc++_shared.so"; then
              echo "ERROR: Native library needs libc++_shared.so; expecting static C++ runtime." >&2
              exit 1
          fi
          echo "JNI export and ARM64 ELF checks passed."
      - name: Package the FCL client-only addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p addon/src/net/minecraftforge/fml/common
          mkdir -p addon/src/fclimguinative
          mkdir -p addon/classes
          mkdir -p addon/stage/fclimguinative
          mkdir -p addon/stage/io/imgui/java/native-bin
          mkdir -p addon/dist

          # Compile against a minimal Forge 1.12.2 @Mod annotation stub.
          # DO NOT package the stub -- FCL's actual Forge provides the annotation.
          cat > addon/src/net/minecraftforge/fml/common/Mod.java <<'JAVA'
          package net.minecraftforge.fml.common;
          import java.lang.annotation.ElementType;
          import java.lang.annotation.Retention;
          import java.lang.annotation.RetentionPolicy;
          import java.lang.annotation.Target;
          @Retention(RetentionPolicy.RUNTIME)
          @Target(ElementType.TYPE)
          public @interface Mod {
              String modid();
              String name() default "";
              String version() default "";
              boolean clientSideOnly() default false;
              String acceptableRemoteVersions() default "";
          }
          JAVA
          cat > addon/src/fclimguinative/NativeResources.java <<'JAVA'
          package fclimguinative;
          import net.minecraftforge.fml.common.Mod;
          @Mod(
              modid = "fclimguinative",
              name = "FCL ImGui 1.86.12 ARM64 Native Resources",
              version = "1.86.12",
              clientSideOnly = true,
              acceptableRemoteVersions = "*"
          )
          public final class NativeResources {
              // No code or extra Java imgui classes. The native binary is a resource.
          }
          JAVA
          javac --release 8 -d addon/classes \
            addon/src/net/minecraftforge/fml/common/Mod.java \
            addon/src/fclimguinative/NativeResources.java

          cp addon/classes/fclimguinative/NativeResources.class addon/stage/fclimguinative/
          cp fcl-cmake/dist/libimgui-java64.so addon/stage/io/imgui/java/native-bin/

          cat > addon/stage/mcmod.info <<'JSON'
          [
            {
              "modid": "fclimguinative",
              "name": "FCL ImGui 1.86.12 ARM64 Native Resources",
              "version": "1.86.12",
              "mcversion": "1.12.2",
              "description": "Client-only helper that supplies the Android ARM64 JNI binary for imgui-java 1.86.12. Does not overwrite existing mods."
            }
          ]
          JSON

          (
            cd addon/stage
            jar cf ../dist/FCL-ImGui-Android-ARM64-1.86.12-addon.jar .
          )
          cp fcl-cmake/dist/libimgui-java64.so addon/dist/libimgui-java64.so
          jar tf addon/dist/FCL-ImGui-Android-ARM64-1.86.12-addon.jar | grep -F "io/imgui/java/native-bin/libimgui-java64.so"
          jar tf addon/dist/FCL-ImGui-Android-ARM64-1.86.12-addon.jar | grep -F "fclimguinative/NativeResources.class"

          {
            echo "Source: SpaiR/imgui-java tag v1.86.12"
            echo "Target: Android arm64-v8a (API 24); C++ static STL"
            echo "JNI symbol count: $(grep -c ' Java_imgui_' fcl-cmake/exported-symbols.txt)"
            echo "SHA256:"
            sha256sum addon/dist/libimgui-java64.so addon/dist/FCL-ImGui-Android-ARM64-1.86.12-addon.jar
          } > addon/dist/BUILD-INFO.txt
          cat addon/dist/BUILD-INFO.txt
      - name: Upload FCL-compatible native library and addon
        uses: actions/upload-artifact@v4
        with:
          name: FCL-ImGui-1.86.12-Android-ARM64
          path: addon/dist/
          if-no-files-found: error
          retention-days: 7
